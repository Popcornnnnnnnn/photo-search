# Release configuration for Photo Search (direct-download distribution).
#
# Nothing here is secret (no private keys / passwords); those live in your
# keychain and the notarytool credential profile.

app_name: "Photo Search"
executable: "LiquidGlassDemo"                 # SwiftPM product name
bundle_identifier: "com.popcornnn.PhotoSearch"
category: "public.app-category.photography"
# Custom URL scheme for deep links, e.g. photosearch://search?q=coffee (see
# DeepLink.swift). Written into the packaged app's Info.plist.
url_scheme: "photosearch"
minimum_system_version: "15.0"

github_owner: "Popcornnnnnnnn"
github_repo: "photo-search"

# The Sparkle appcast the app polls for updates. Served raw from the default
# branch (kept in sync by scripts/release.sh).
feed_url: "https://raw.githubusercontent.com/Popcornnnnnnnn/photo-search/main/appcast.xml"

# Base URL that release DMGs are downloaded from (GitHub Releases by default).
download_base_url: "https://github.com/Popcornnnnnnnn/photo-search/releases/download"

# --- Signing & notarization (do NOT commit secrets) ---
# Developer ID Application identity, as shown by `security find-identity -v -p codesigning`.
developer_id_application: "Developer ID Application: WEIZHI WANG (R26X7B8XDT)"
apple_team_id: "R26X7B8XDT"
# Keychain profile created via: xcrun notarytool store-credentials
# (Override locally with PHOTO_SEARCH_NOTARY_PROFILE if using a shared profile.)
notarytool_keychain_profile: "photo-search-notary"
# Base64 Ed25519 public key printed by Sparkle's `generate_keys` (private key
# stays in your keychain). Injected into the app's Info.plist as SUPublicEDKey.
sparkle_public_ed_key: "ZScBnd4pIKIFMuTo9+MN4ZlEUr14ZYrUNJsxJEZEbFY="
