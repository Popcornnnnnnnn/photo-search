[project]
name = "photo-search"
version = "0.1.0"
description = "Private, local-first semantic search pilot for Apple Photos"
requires-python = ">=3.11"

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10,<3"]
embeddings = ["torch>=2.8,<3", "torchvision>=0.23,<1", "transformers==4.57.6", "Pillow>=11,<13", "numpy>=1.26,<3"]

[project.scripts]
photo-search = "photo_search.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["photo_search"]
